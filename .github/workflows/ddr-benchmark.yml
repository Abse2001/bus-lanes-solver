name: AM3352 placement benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # Run only the four AM3352 placements. Search failures remain failures in
      # the score; malformed fixtures and invalid completed copper fail the job.
      - run: ./benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am3352-placement-benchmark-results
          path: benchmark-results.json

  hypergraph:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: >-
          ./benchmark.sh --solver hypergraph --require-all-solved
          --timeout-seconds 1200 --output benchmark-hypergraph-results.json
          --artifacts docs/hypergraph-am3352
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypergraph-am3352-results
          path: |
            benchmark-hypergraph-results.json
            docs/hypergraph-am3352/
