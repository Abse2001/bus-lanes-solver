name: AM3352 placement benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # Require all eight powered AM3352 samples to complete and pass native
      # DRC plus full pad-to-pad length matching.
      - run: ./benchmark.sh --timeout-seconds 60 --require-all-solved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am3352-placement-benchmark-results
          path: benchmark-results.json
