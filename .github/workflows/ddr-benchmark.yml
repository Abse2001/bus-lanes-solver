name: DDR benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Shared runners need headroom beyond the local one-second performance target.
      # Keep a bounded deadline and record the actual solve times in the artifact.
      - run: ./benchmark.sh --timeout-seconds 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ddr-benchmark-results
          path: benchmark-results.json
